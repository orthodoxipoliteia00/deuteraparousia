<br><center><h2 style="font-family:Verdana;">ΔΕΥΤΕΡΑ ΠΑΡΟΥΣΙΑ<br>
(ΗΜΕΡΑ ΤΗΣ ΜΕΛΛΟΥΣΗΣ ΚΡΙΣΕΩΣ/ΣΥΝΤΕΛΕΙΑ ΤΟΥ ΚΟΣΜΟΥ)</h2></center><br>
<center><object><a style="font-family:Verdana; color:blue; font-size:22px; font-weight:bold;">Κατά Ματθαίον (Κεφάλαιο 25, 31-46)</a></object></center><br>
<object class='h3'  style='font-size:22px; color:#2F4F4F; font-weight:normal; line-height:100%; font-family:Times New Roman; text-decoration: none;'>῞Οταν δὲ ἔλθῃ ὁ υἱὸς τοῦ ἀνθρώπου ἐν τῇ δόξῃ αὐτοῦ καὶ πάντες οἱ ἅγιοι ἄγγελοι μετ᾿ αὐτοῦ, τότε καθίσει ἐπὶ θρόνου δόξης αὐτοῦ, <br>καὶ συναχθήσεται ἔμπροσθεν αὐτοῦ πάντα τὰ ἔθνη, καὶ ἀφοριεῖ αὐτοὺς ἀπ᾿ ἀλλήλων ὥσπερ ὁ ποιμὴν ἀφορίζει τὰ πρόβατα ἀπὸ τῶν ἐρίφων,<br>
καὶ στήσει τὰ μὲν πρόβατα ἐκ δεξιῶν αὐτοῦ, τὰ δὲ ἐρίφια ἐξ εὐωνύμων.<br>
τότε ἐρεῖ ὁ βασιλεὺς τοῖς ἐκ δεξιῶν αὐτοῦ· <b>δεῦτε οἱ εὐλογημένοι τοῦ πατρός μου, κληρονομήσατε τὴν ἡτοιμασμένην ὑμῖν βασιλείαν ἀπὸ καταβολῆς κόσμου.<br>
ἐπείνασα γάρ, καὶ ἐδώκατέ μοι φαγεῖν, ἐδίψησα, καὶ ἐποτίσατέ με, ξένος ἤμην, καὶ συνηγάγετέ με,<br>
γυμνός, καὶ περιεβάλετέ με, ἠσθένησα, καὶ ἐπεσκέψασθέ με, ἐν φυλακῇ ἤμην, καὶ ἤλθετε πρός με.</b><br>
τότε ἀποκριθήσονται αὐτῷ οἱ δίκαιοι λέγοντες· κύριε, πότε σε εἴδομεν πεινῶντα καὶ ἐθρέψαμεν, ἢ διψῶντα καὶ ἐποτίσαμεν;<br>
πότε δέ σε εἴδομεν ξένον καὶ συνηγάγομεν, ἢ γυμνὸν καὶ περιεβάλομεν;<br>
πότε δέ σε εἴδομεν ἀσθενῆ ἢ ἐν φυλακῇ, καὶ ἤλθομεν πρός σε;<br>
καὶ ἀποκριθεὶς ὁ βασιλεὺς ἐρεῖ αὐτοῖς· ἀμὴν λέγω ὑμῖν, ἐφ᾿ ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.<br>
τότε ἐρεῖ καὶ τοῖς ἐξ εὐωνύμων· πορεύεσθε ἀπ᾿ ἐμοῦ οἱ κατηραμένοι εἰς τὸ πῦρ τὸ αἰώνιον τὸ ἡτοιμασμένον τῷ διαβόλῳ καὶ τοῖς ἀγγέλοις αὐτοῦ.<br>
ἐπείνασα γάρ, καὶ οὐκ ἐδώκατέ μοι φαγεῖν, ἐδίψησα, καὶ οὐκ ἐποτίσατέ με,<br>
ξένος ἤμην, καὶ οὐ συνηγάγετέ με, γυμνός, καὶ οὐ περιεβάλετέ με, ἀσθενὴς καὶ ἐν φυλακῇ, καὶ οὐκ ἐπεσκέψασθέ με.<br>
τότε ἀποκριθήσονται αὐτῷ καὶ αὐτοὶ λέγοντες· κύριε, πότε σε εἴδομεν πεινῶντα ἢ διψῶντα ἢ ξένον ἢ γυμνὸν ἢ ἀσθενῆ ἢ ἐν φυλακῇ, καὶ οὐ διηκονήσαμέν σοι;<br>
τότε ἀποκριθήσεται αὐτοῖς λέγων· ἀμὴν λέγω ὑμῖν, ἐφ᾿ ὅσον οὐκ ἐποιήσατε ἑνὶ τούτων τῶν ἐλαχίστων, οὐδὲ ἐμοὶ ἐποιήσατε.<br>
<b>καὶ ἀπελεύσονται οὗτοι εἰς κόλασιν αἰώνιον, οἱ δὲ δίκαιοι εἰς ζωὴν αἰώνιον.</b></object>
<BR><BR>
<center><object><a style="font-family:Verdana; color:blue; font-size:22px; font-weight:bold;">Αποκάλυψη Ιωάννου (Κεφάλαιο 20, 11-15)</a></object></center><br>
<object class='h3'  style='font-size:22px; color:#2F4F4F; font-weight:normal; line-height:100%; font-family:Times New Roman; text-decoration: none;'>
Καὶ εἶδον θρόνον μέγαν λευκὸν καὶ τὸν καθήμενον ἐπ᾿ αὐτῷ, οὗ ἀπὸ προσώπου ἔφυγεν ἡ γῆ καὶ ὁ οὐρανός, καὶ τόπος οὐχ εὑρέθη αὐτοῖς. καὶ εἶδον τοὺς νεκρούς, τοὺς μεγάλους καὶ τοὺς μικρούς, ἑστῶτας ἐνώπιον τοῦ θρόνου, καὶ <b>βιβλία ἠνοίχθησαν· καὶ ἄλλο βιβλίον ἠνοίχθη, ὅ ἐστι τῆς ζωῆς</b>· καὶ <b>ἐκρίθησαν οἱ νεκροὶ ἐκ τῶν γεγραμμένων ἐν τοῖς βιβλίοις κατὰ τὰ ἔργα αὐτῶν</b>. καὶ ἔδωκεν ἡ θάλασσα τοὺς νεκροὺς τοὺς ἐν αὐτῇ, καὶ ὁ θάνατος καὶ ὁ ᾅδης ἔδωκαν τοὺς νεκροὺς τοὺς ἐν αὐτοῖς, καὶ <b>ἐκρίθησαν ἕκαστος κατὰ τὰ ἔργα αὐτῶν</b>. καὶ ὁ θάνατος καὶ ὁ ᾅδης ἐβλήθησαν εἰς τὴν λίμνην τοῦ πυρός· οὗτος ὁ θάνατος ὁ δεύτερός ἐστιν. καὶ εἴ τις <b>οὐχ εὑρέθη ἐν τῇ βίβλῳ τῆς ζωῆς γεγραμμένος, ἐβλήθη εἰς τὴν λίμνην τοῦ πυρός.</b>
<BR><BR>
<center><object><a style="font-family:Verdana; color:blue; font-size:22px; font-weight:bold;">Παλαιά Διαθήκη/Δανιήλ (Κεφάλαιο 7, 10)</a></object></center><br>
<object class='h3'  style='font-size:22px; color:#2F4F4F; font-weight:normal; line-height:100%; font-family:Times New Roman; text-decoration: none;'>
ποταμὸς πυρὸς εἷλκεν ἔμπροσθεν αὐτοῦ· χίλιαι χιλιάδες ἐλειτούργουν αὐτῷ, καὶ μύριαι μυριάδες παρειστήκεισαν αὐτῷ· κριτήριον ἐκάθισε, καὶ <b>βίβλοι ἠνεῴχθησαν</b>.
<BR><BR>
<center><object><a style="font-family:Verdana; color:blue; font-size:22px; font-weight:bold;">Κατά Λουκάν (Κεφάλαιο 21, 25-28)</a></object></center><br>
<object class='h3'  style='font-size:22px; color:#2F4F4F; font-weight:normal; line-height:100%; font-family:Times New Roman; text-decoration: none;'>
<b>Καὶ ἔσται σημεῖα ἐν ἡλίῳ καὶ σελήνῃ καὶ ἄστροις, καὶ ἐπὶ τῆς γῆς συνοχὴ ἐθνῶν ἐν ἀπορίᾳ ἠχούσης θαλάσσης καὶ σάλου,</b><br>
ἀποψυχόντων ἀνθρώπων ἀπὸ φόβου καὶ προσδοκίας τῶν ἐπερχομένων τῇ οἰκουμένῃ· <b>αἱ γὰρ δυνάμεις τῶν οὐρανῶν σαλευθήσονται</b>.<br>
καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλῃ μετὰ δυνάμεως καὶ δόξης πολλῆς.<br>
ἀρχομένων δὲ τούτων γίνεσθαι ἀνακύψατε καὶ ἐπάρατε τὰς κεφαλὰς ὑμῶν, διότι ἐγγίζει ἡ ἀπολύτρωσις ὑμῶν.</object></center>
<BR><BR>
<center><object><a style="font-family:Verdana; color:blue; font-size:22px; font-weight:bold;">Κατά Ματθαίον (Κεφάλαιο 24, 29-31)</a></object></center><br>
<object class='h3'  style='font-size:22px; color:#2F4F4F; font-weight:normal; line-height:100%; font-family:Times New Roman; text-decoration: none;'>
Εὐθέως δὲ μετὰ τὴν θλῖψιν τῶν ἡμερῶν ἐκείνων <b>ὁ ἥλιος σκοτισθήσεται καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς, καὶ οἱ ἀστέρες πεσοῦνται ἀπὸ τοῦ οὐρανοῦ, καὶ αἱ δυνάμεις τῶν οὐρανῶν σαλευθήσονται.</b><BR>
καὶ τότε φανήσεται τὸ σημεῖον τοῦ υἱοῦ τοῦ ἀνθρώπου ἐν τῷ οὐρανῷ, καὶ τότε κόψονται πᾶσαι αἱ φυλαὶ τῆς γῆς καὶ ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐπὶ τῶν νεφελῶν τοῦ οὐρανοῦ μετὰ δυνάμεως καὶ δόξης πολλῆς.<BR>
καὶ ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ μετὰ σάλπιγγος φωνῆς μεγάλης, καὶ ἐπισυνάξουσι τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων ἀπ᾿ ἄκρων οὐρανῶν ἕως ἄκρων αὐτῶν.</object></center>
<BR><BR>
<center><object><a style="font-family:Verdana; color:blue; font-size:22px; font-weight:bold;">Κατά Μάρκον (Κεφάλαιο 13, 24-27)</a></object></center><br>
<object class='h3'  style='font-size:22px; color:#2F4F4F; font-weight:normal; line-height:100%; font-family:Times New Roman; text-decoration: none;'>
᾿Αλλ᾿ ἐν ἐκείναις ταῖς ἡμέραις, μετὰ τὴν θλῖψιν ἐκείνην <b>ὁ ἥλιος σκοτισθήσεται, καὶ ἡ σελήνη οὐ δώσει τὸ φέγγος αὐτῆς,<br>
καὶ οἱ ἀστέρες ἔσονται ἐκ τοῦ οὐρανοῦ πίπτοντες, καὶ αἱ δυνάμεις αἱ ἐν τοῖς οὐρανοῖς σαλευθήσονται.</b><br>
καὶ τότε ὄψονται τὸν υἱὸν τοῦ ἀνθρώπου ἐρχόμενον ἐν νεφέλαις μετὰ δυνάμεως πολλῆς καὶ δόξης.<br>
καὶ τότε ἀποστελεῖ τοὺς ἀγγέλους αὐτοῦ καὶ ἐπισυνάξει τοὺς ἐκλεκτοὺς αὐτοῦ ἐκ τῶν τεσσάρων ἀνέμων, ἀπ' ἄκρου τῆς γῆς ἕως ἄκρου τοῦ οὐρανοῦ.</object></center>
<BR><BR>
<center><object><a style="font-family:Verdana; color:blue; font-size:22px; font-weight:bold;">Επιστολή Πέτρου Β' (Κεφάλαιο 3, 10-12)</a></object></center><br>
<object class='h3'  style='font-size:22px; color:#2F4F4F; font-weight:normal; line-height:100%; font-family:Times New Roman; text-decoration: none;'>
῞Ηξει δὲ ἡ ἡμέρα Κυρίου ὡς κλέπτης ἐν νυκτί, <b>ἐν ᾖ οὐρανοὶ ροιζηδὸν παρελεύσονται, στοιχεῖα δὲ καυσούμενα λυθήσονται, καὶ γῆ καὶ τὰ ἐν αὐτῇ ἔργα κατακαήσεται.</b><br>
Τούτων οὖν πάντων λυομένων ποταποὺς δεῖ ὑπάρ-χειν ὑμᾶς ἐν ἁγίαις ἀναστροφαῖς καὶ εὐσεβείαις<br>
προσδοκῶντας καὶ σπεύδοντας τὴν παρουσίαν τῆς τοῦ Θεοῦ ἡμέρας, <b>δι᾿ ἣν οὐρανοὶ πυρούμενοι λυθήσονται καὶ στοιχεῖα καυσούμενα τήκεται!</b></object></center>
</object>
</object>
